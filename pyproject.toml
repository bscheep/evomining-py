[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evomining"
version = "1.0.0"
description = "Enzyme family expansion analysis for biosynthetic gene cluster discovery"
requires-python = ">=3.9"
dependencies = ["numpy", "biopython"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evomining = "evomining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "genomes: needs the example genomes in tests/data/los17_genomes/",
    "tools: needs the external bioinformatics toolchain (BLAST, MUSCLE, trimAl, FastTree, newick-utils)",
]
